# 正式清洗框架的稳定入口。阈值和审计门在框架阶段必须保持 UNSET。
status: "FRAMEWORK_FROZEN / REFERENCE_DEDUP_FINALIZED / THRESHOLD_PENDING"
label_guide_version: "text-cleaning-v1.5"
random_seed: 20260728

# 唯一权威标签证据的构建契约。0.80只生成候选，不自动排除。
reference:
  contract: "final-nonduplicate-model-reference"
  target_count: 700
  probability_count: 500
  targeted_count: 200
  duplicate_analyzer: "char"
  duplicate_ngram_range: [3, 5]
  duplicate_similarity_threshold: 0.80
  duplicate_threshold_role: "candidate_only"
  replacement_scope: "global"
  replacement_platform_quota: false
  replacement_platform_sort: false
  probability_invalid_behavior: "mark_unavailable"

text:
  analyzer: "char"
  ngram_range: [2, 5]
  min_df: 2
  max_df: 0.995
  sublinear_tf: true
  classifier: "linear_svm"
  svm_c: 1.0
  class_weight: "balanced"
  calibration: "sigmoid"
  calibration_folds: 5

leakage:
  author: true
  exact_duplicate: true
  confirmed_near_duplicate: true

split:
  temporal_test_fraction: 0.20
  validation_fraction: 0.20
  scope: "global"

routing:
  T_keep: "UNSET"
  T_exclude: "UNSET"
  unset_behavior: "manual_review"

audit:
  sample_size: "UNSET"
  max_event_rate: "UNSET"
  upper_confidence_limit: "UNSET"
  recovery_gate: "UNSET"
  population: "retained_global"

artifacts:
  # 规则同时冻结普通文本规范化与结构化正文到纯文本的确定性投影。
  normalization_config: "configs/cleaning-text-normalization-v1.yaml"
  normalization_version_lock: "text-normalization-v1+sha256:6bd3fd6a94605e6dcd54908fa98d47c05561e7275835f493c459af5380ad5360"
