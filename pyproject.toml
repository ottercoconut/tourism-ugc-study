[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-ugc-study"
version = "0.1.0"
description = "Reproducible multi-platform UGC research for tourism destination perception in Qingdao, China."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyYAML>=6.0,<7",
    "numpy==2.5.1",
    "regex==2026.7.19",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "joblib==1.5.3",
    "Pillow==12.3.0",
    "ImageHash==4.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
