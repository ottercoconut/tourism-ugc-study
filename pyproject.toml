[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-ugc-study"
version = "0.1.0"
description = "Reproducible multi-platform UGC research for tourism destination perception in Qingdao, China."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PyYAML>=6.0,<7",
    "regex>=2025.7,<2027",
    "scikit-learn>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
